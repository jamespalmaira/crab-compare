# Crab model comparison: run configuration.
# Every model uses the same data split, augmentation, optimizer, schedule,
# epochs, effective batch size and seeds. Only the micro-batch size per model
# differs (to fit GPU memory); gradient accumulation keeps the effective batch
# identical.

run_name: dev
results_dir: results      # outputs go to results/<run_name>/ (not committed)

data:
  # labels.csv from tools/dataset_builder: image_path, crab_id (observer group),
  # genus, species, country, source, ... image_path is relative to labels.csv.
  labels_csv: data/labels.csv
  # The main task is genus-level classification. Species is secondary and
  # exploratory (Scylla species labels are unreliable from photos, and
  # S. tranquebarica has thin data). Sex, maturity and disease are out of scope
  # (the code still accepts those columns). See handoff.md.
  main_attribute: genus
  attributes: [genus, species]
  num_workers: 2
  # Optional pre-resized image cache (null = off). When set, e.g. 512, every image
  # whose longer side is above it is resized once (Lanczos) into
  # data/cache/longer_<N>/ (outside git) and all models read from there; smaller
  # images are copied unchanged. Augmentation is the same either way.
  cache_longer_side: null
  # Each attribute uses only the rows labeled for it. It is skipped (with a
  # message) if it has fewer than 2 classes, or any class has fewer than this
  # many distinct crab_id groups.
  min_groups_per_class: 30
  # With a source column in labels.csv, flag any class where one source
  # supplies more than this share of the images.
  source_dominance_threshold: 0.8
  # External test set: rows where `column` equals `value` are held out of every
  # train, validation and CV-test split, and every model is tested on them after
  # training. Every observer who appears in the external set (by crab_id and
  # observer_id) is also removed from the training side. The Philippine photos
  # are the local check: genus is tied to country, and about 95% of the data is
  # non-Philippine. Remove this block to use every row for cross-validation.
  external_test:
    column: country
    value: PH
    name: Philippines
    group_columns: [crab_id, observer_id]
    report_by: genus

split:
  # 5-fold cross-validation by crab_id group (observer, from the dataset builder),
  # stratified on species within genus. Decided 2026-10-26: the smallest genus
  # (Charybdis, 65 groups) gives about 13 test groups per fold.
  strategy: kfold         # holdout (single 70/15/15 split) or kfold (crab-level CV)
  ratios: [0.70, 0.15, 0.15]   # train, val, test. In kfold, test is the held-out
                               # fold and val is carved from the rest at val/(train+val).
  n_folds: 5
  seed: 42                # split seed; separate from the training seeds below
  # Stratify an attribute on a finer column while the label stays coarse: the
  # genus split is stratified on genus/species, so every fold keeps each
  # genus's species mix. Groups identified only to genus form their own
  # stratum. A stratum with fewer than min_stratum_groups crab_id groups is
  # folded into its genus's largest stratum; 10 groups is enough for a
  # species to land in train, val and test of every fold at 70/15/15 or 5 folds.
  stratify_by: {genus: species}
  min_stratum_groups: 10
  dir: splits             # saved next to labels.csv, e.g. data/splits/

augmentation:             # training only; identical for every model
  hflip_p: 0.5
  rotate_limit: 15        # degrees
  rotate_p: 0.5
  color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02, p: 0.8}
  resized_crop_scale: [0.7, 1.0]

# Input size, mean and std come from each model's own timm config, not from here.
# batch_size is the per-step micro-batch that fits on a 4 GB GTX 1650; it must
# divide training.effective_batch_size.
models:
  efficientnet_b3:       {name: EfficientNet-B3, batch_size: 8}
  resnet50:              {name: ResNet-50,       batch_size: 16}
  densenet121:           {name: DenseNet-121,    batch_size: 16}
  mobilenetv3_large_100: {name: MobileNetV3,     batch_size: 32}
  vit_base_patch16_224:  {name: ViT,             batch_size: 8}

# PRE-DECLARED for the full run (full_genus_v1), fixed on 2026-10-26 before any
# results: main attribute genus; seeds [0, 1, 2]; max epochs 50; early-stopping
# patience 10; amp false; data.num_workers 2; data.cache_longer_side off (null);
# no cap on Portunus photos and no balanced sampling (the class-weighted loss
# handles imbalance). Reasons: the timing checks estimate about 17 h likely and
# 32 h at most for this setup, and the image cache gave no speedup. See handoff.md.
# Do not change these for the full run.
training:
  pretrained: true        # weights download on the first real run (needs internet)
  effective_batch_size: 32
  epochs: 50
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.05
  scheduler: cosine
  early_stopping_patience: 10   # epochs without val macro-F1 improvement
  # Mixed precision: one global setting for all five models, never per model.
  # Decided off (final, see handoff.md) on the GTX 1650 (4 GB), cuDNN 9.10:
  #  - all ten configurations (5 models x AMP on/off) fit in 4 GB in fp32;
  #  - AMP was slower on this GPU (fp32 steps 1.3-3.8x faster);
  #  - a cuDNN fp16 bug in ResNet-50's layer4.0.downsample.0 gives NaNs that
  #    depend on batch size (not an overflow).
  # The AMP code path is kept; run.py warns if this is set to true.
  amp: false
  seeds: [0, 1, 2]

evaluation:               # on the test set of each run, always fp32
  latency_warmup: 10      # inference-time runs discarded before timing
  latency_runs: 50        # timed runs, batch of 1; mean ms per image
  latency_cpu: true       # also time on CPU (GPU is timed when available)

analysis:                 # build step 5, run on a finished results folder
  stats_alpha: 0.05       # significance level for the Holm-corrected McNemar tests
  gradcam_images: 8       # test images per model for the Grad-CAM check and overlays
  gradcam_seed: 0         # which images are sampled
  onnx_opset: 17
  onnx_rtol: 0.001        # onnxruntime vs PyTorch output tolerance
  onnx_atol: 0.0001
  # ONNX Runtime CPU latency protocol, batch size 1 (the ranking's inference time). Decided
  # 2026-10-27 after the first analysis of full_genus_v1, where a single 50-run timing moved
  # by up to 46% between two passes (ViT 281 -> 411 ms) and flipped the sensitivity check.
  # Each repeat times a model in its own new process, with other programs closed; the ranking
  # uses the median of the per-process medians. threads = physical cores of the timing PC
  # (AMD Ryzen 5 3550H, 4 cores / 8 threads). Run with: --analyze-only --analyze-steps latency
  onnx_latency:
    threads: 4            # fixed ONNX Runtime intra-op threads (inter-op 1, sequential)
    warmup: 20
    runs: 200             # timed runs per process; median and IQR reported
    repeats: 3            # separate processes per model

selection:                # build step 6; fixed before results are seen (2026-10-26)
  # Only the main task is scored. Exploratory results (species) are reported but
  # must not affect the choice of backbone.
  attributes: [genus]
  # Tie rule (the recommendation): a model is tied with the best when it is not
  # significantly worse by McNemar (Holm-corrected, alpha) and its mean macro-F1 is
  # within one standard deviation of the best. Tied models are ranked by speed,
  # size and Grad-CAM only. Both rankings are reported.
  tie_rule:
    enabled: true
    alpha: 0.05
    # Which McNemar test decides "significantly worse" (added 2026-10-27, after the first
    # analysis of full_genus_v1): per_seed runs the test separately for each seed (every test
    # image once, Holm across the pairs within that seed) and counts a model as worse only if it
    # is significant in every seed. pooled (the original) pools all seeds, which treats the same
    # images tested three times as independent pairs and makes p-values too small. Both are reported.
    mcnemar: per_seed
  weights:                # must sum to 1
    macro_f1: 0.50        # mean test macro-F1 across attributes (higher is better)
    inference_time: 0.20  # ONNX Runtime CPU latency, batch size 1 (lower is better)
    model_size: 0.15      # fp32 weight file size in MB (lower is better)
    gradcam: 0.15         # Grad-CAM compatibility check, pass/fail
  sensitivity:            # alternative weight sets; reported, never used to pick
    - {macro_f1: 0.60, inference_time: 0.15, model_size: 0.10, gradcam: 0.15}
    - {macro_f1: 0.40, inference_time: 0.25, model_size: 0.20, gradcam: 0.15}
    - {macro_f1: 0.70, inference_time: 0.10, model_size: 0.10, gradcam: 0.10}

device: auto            # auto (cuda if available, else cpu with a warning), cuda, cpu

gpu:
  # Cap PyTorch's share of dedicated VRAM so going over raises a clear
  # out-of-memory error instead of the Windows driver silently spilling into
  # system RAM. The rest is left for the CUDA context and cuDNN workspace.
  memory_fraction: 0.85
